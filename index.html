<!doctype html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src &#39;self&#39;; script-src &#39;self&#39; &#39;wasm-unsafe-eval&#39;; style-src &#39;self&#39; &#39;unsafe-inline&#39;; img-src &#39;self&#39; data: blob:; font-src &#39;self&#39; data:; connect-src &#39;self&#39; data: blob:; worker-src &#39;self&#39; blob:; object-src &#39;none&#39;; base-uri &#39;self&#39;; form-action &#39;none&#39;">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#20262e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <title>Yeroo eBook Viewer</title>
  <script type="module" crossorigin src="./assets/index-6tAbCdvn.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B81qryOB.css">
</head>
<body>
  <nav id="books" aria-label="책 탭" hidden>
    <button id="homeTab"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5V13h-3.5V9.5h-4V13H2.5z"/></svg>서재</button>
    <div id="bookList"></div>
    <button id="moreBooks" hidden></button>
  </nav>
  <section id="home">
    <header>
      <h1>서재</h1>
      <div class="actions">
        <button id="themeBtn" title="밝게/어둡게" aria-label="밝게/어둡게">◐</button>
        <button id="aboutBtn" title="앱 정보: 버전·저장 공간·공개 프로그램" aria-label="앱 정보">ⓘ</button>
        <button id="sampleBtn">샘플 문서</button>
        <button id="openBtn" class="primary">파일 열기</button>
      </div>
    </header>
    <p class="hint">PDF나 이미지 파일을 열거나 이 화면에 끌어다 놓으세요. 이미지 여러 장을 함께 고르면 한 권으로 묶입니다. 서재 백업(.json, .zip)을 열면 책들이 서재에 돌아옵니다.</p>
    <p class="hint" id="linkHint" hidden>PDF는 기기의 원래 자리에 둔 채 엽니다. 파일을 옮기거나 지우면 책을 열 때 다시 골라 주세요.</p>
    <div id="backup" hidden>
      <span id="backupMsg"></span>
      <span class="choices">
        <button id="notesBtn" title="책 목록과 필기만 작은 파일 하나로 내려받습니다. 책 파일(PDF·그림)은 담지 않습니다">필기 백업</button>
        <button id="backupBtn" title="서재의 책을 모두 필기가 든 PDF로 만들어 ZIP 파일 하나로 내려받습니다. 기기를 바꿀 때 씁니다">책까지 백업</button>
      </span>
    </div>
    <div id="lostBooks" hidden>
      <span id="lostBooksMsg"></span>
      <button id="lostBooksBtn">책 파일 고르기</button>
    </div>
    <div id="lib"></div>
  </section>

  <section id="reader" hidden>
    <div id="chrome">
    <div class="bar nav">
      <span class="group">
        <button id="sideBtn" title="페이지·목차·인덱스·필기·검색">☰</button>
      </span>
      <span class="grow"></span>
      <span class="group" id="pageBox">
        <button id="prevBtn" title="이전 쪽">‹</button>
        <input id="pageNo" inputmode="numeric" aria-label="쪽 번호">
        <button id="pageCount" title="쪽 넘김 바(처음·끝으로, 멀리 가기)"></button>
        <button id="nextBtn" title="다음 쪽">›</button>
      </span>
      <span class="group">
        <button id="zoomOut" title="축소">−</button>
        <button id="zoomLabel" title="맞춤 크기로 돌아가기"></button>
        <button id="zoomIn" title="확대">＋</button>
      </span>
      <span class="group">
        <button id="undoBtn" title="실행 취소">↶</button>
        <button id="redoBtn" title="다시 실행">↷</button>
      </span>
      <span class="group">
        <button id="tabSideBtn" class="tab" data-where="side" title="옆 인덱스: 이 쪽의 오른쪽 위에 표식을 답니다" aria-label="옆 인덱스"><i class="tabicon side"></i></button>
        <button id="tabTopBtn" class="tab" data-where="top" title="위 인덱스: 정말 중요한 쪽의 위쪽에 표식을 답니다" aria-label="위 인덱스"><i class="tabicon top"></i></button>
        <button id="viewBtn" title="크기 맞춤·넘기는 방식·2쪽 보기·다크 모드">보기 ▾</button>
      </span>
      <button id="saveBtn" class="primary" title="필기를 포함해 PDF로 저장합니다. 이 앱에서 다시 열면 필기를 이어서 고칠 수 있습니다">PDF 저장</button>
    </div>
    <div class="bar tools">
      <span class="group" id="toolBtns">
        <button data-tool="hand">이동</button>
        <button data-tool="pen" title="글줄 맞춤이나 직선으로 그은 선의 끝을 누르면 끝 모양이 화살표 → : → 없음 순으로 바뀝니다">펜</button>
        <button data-tool="hl">형광펜</button>
        <button data-tool="eraser" title="손글씨를 지웁니다(쪽 위의 글은 글 도구에서 글자를 모두 지우면 사라집니다)">지우개</button>
        <button data-tool="text" title="쪽을 눌러 글을 씁니다. 쓴 글은 누르면 고치고 끌면 옮깁니다. 글자를 모두 지우면 사라집니다">글</button>
        <button data-tool="memo" title="페이지를 눌러 메모장을 넣습니다">메모</button>
      </span>
      <span class="group" id="colorBox">
        <button id="colorBtn" title="색" aria-haspopup="true"><i class="dot"></i></button>
      </span>
      <span class="group" id="sizeBox">
        <button id="sizeDown" title="가늘게·작게" aria-label="굵기·크기 줄이기">−</button>
        <span id="sizeLabel" aria-live="polite"></span>
        <button id="sizeUp" title="굵게·크게" aria-label="굵기·크기 늘리기">＋</button>
      </span>
      <span class="group">
        <button id="straightBtn" title="그은 선을 직선으로 만듭니다(수평·수직에 가까우면 반듯하게). 글줄 맞춤이 꺼져 있을 때 적용됩니다">직선</button>
        <button id="snapBtn" title="펜은 글줄 밑에, 형광펜은 글줄 위에 자동으로 맞춥니다. 끄면 아무 데나 그릴 수 있습니다">글줄 맞춤</button>
      </span>
    </div>
    </div>
    <div class="body">
      <aside id="side" hidden>
        <nav id="tabs">
          <button data-tab="pages">페이지</button>
          <button data-tab="toc">목차</button>
          <button data-tab="marks">인덱스</button>
          <button data-tab="notes">필기</button>
          <button data-tab="search">검색</button>
        </nav>
        <div id="panel"></div>
      </aside>
      <div id="stage">
        <main id="scroller"><div id="pages"></div></main>
        <div id="turnHint" aria-hidden="true"></div>
        <div id="lost" role="status" hidden>
          <span id="lostMsg"></span>
          <button id="lostBtn" class="primary"></button>
          <button id="lostClose" aria-label="닫기" title="닫기">×</button>
        </div>
        <div id="pager" hidden>
          <button id="pagerBack" hidden></button>
          <div class="row">
            <button id="pagerFirst">처음</button>
            <button id="pagerPrev" aria-label="이전 쪽">‹</button>
            <input id="pagerSlider" type="range" min="1" step="1" aria-label="쪽 이동">
            <span id="pagerLabel"></span>
            <button id="pagerNext" aria-label="다음 쪽">›</button>
            <button id="pagerLast">끝</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="palette" role="group" aria-label="색" hidden></div>
  <canvas id="loupe" hidden></canvas>
  <div id="toast" hidden></div>
  <div id="update" role="status" hidden>
    <span>새 버전이 있습니다.</span>
    <button id="updateNow" class="primary">지금 바꾸기</button>
    <button id="updateLater">나중에</button>
  </div>
  <div id="saveFail" role="alert" hidden>
    <span id="saveFailMsg"></span>
    <button id="saveRetry" class="primary">지금 다시 저장</button>
  </div>
  <dialog id="away" class="ask">
    <p id="awayMsg"></p>
    <div class="choices"><button id="awayBtn" class="primary"></button></div>
  </dialog>
  <div id="busy" hidden><div><i class="spin"></i><span id="busyMsg"></span></div></div>
</body>
</html>
